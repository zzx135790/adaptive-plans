name: Adaptive Architecture Check

on:
  pull_request:

jobs:
  adaptive-architecture:
    name: adaptive-architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate architecture impact against the pull request diff
        env:
          ADAPTIVE_PLAN_CLI: node tools/adaptive-planning-governance/scripts/adaptive-plan.mjs
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >
          $ADAPTIVE_PLAN_CLI architecture check
          --project-root .
          --base "$BASE_SHA"
          --head "$HEAD_SHA"
          --impact docs/architecture/adaptive/changes/current-impact.json
